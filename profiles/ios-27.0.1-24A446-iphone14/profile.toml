"043-69730-712.dmg.aea.trustcache" = "d3b021881ecb5162b2f1f6be0032f3d142c9a794a36c894f4db2769136f35d33"

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
slide = "0"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "c28f4fc9b83cde00087e81f890c82d566b9e98b5ac228dfecd83afdf34070445"
extra_args = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"]
# D27 AMFI early wrapper: BTI/PACIBSP; BL 0xfffffff008e8f6c4; MOV w0,#0; RETAB.
# 0xfffffff008e8f6c4 calls 0xfffffff008e8b740, which invokes the
# amfi_interface_register slot 0xfffffff007e6dce0, so trust_cache_runtime_init
# finds the interface. Derived from the D27 kernelcache, not copied from J820.
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff008e8fe7c"
# Do not reuse J820 early AMFI addresses or its unresolved-reference policy for D27.
# The original D27 kernelcache carries com.apple.security.sandbox and
# com.apple.kext.AppleMatch; the original launchd refuses to start its container
# without the registered Sandbox policy, so both stay in this D27 kernel.
roots = ["com.apple.filesystems.apfs", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.security.AppleImage4", "com.apple.kext.CoreTrust", "com.apple.kec.corecrypto", "com.apple.iokit.IOStorageFamily", "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.security.sandbox", "com.apple.kext.AppleMatch"]

[adt.root.string]
model = "iPhone14,7"
target-type = "D27"
# Hardware compatible comes from the board DT, never from Apple's device class.

[adt.chosen.string]
